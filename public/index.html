  --brand-red-glow: rgba(255,95,109,0.7);
  --status-red-bg:  rgba(255,95,109,0.12);
  --status-ylw-bg:  rgba(255,192,72,0.12);
  --status-grn-bg:  rgba(76,175,125,0.12);

/* ライトテーマ (.light クラスを <html> に付与) */
.light {
  --brand-bg:       #F4F6F9;
  --brand-surface:  #ffffff;
  --brand-surface2: #ccc8c0;
  --brand-border:   #b8b2a8;
  --brand-accent:   #b8860b;
  --brand-text:     #1a1614;
  --brand-muted:    #6b6456;
  --brand-red:      #c0212e;

  --nav-active-bg:  rgba(184,134,11,0.12);
  --brand-red-glow: rgba(192,33,46,0.7);
  --status-red-bg:  rgba(192,33,46,0.08);
  --status-ylw-bg:  rgba(156,109,0,0.08);
  --status-grn-bg:  rgba(45,122,82,0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--brand-bg);font-family:'Noto Sans JP',sans-serif;color:var(--brand-text);-webkit-text-size-adjust:none;overscroll-behavior:none;transition:background .2s,color .2s}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;border:none}
input{outline:none}
input[type=date]{color-scheme:dark}
.light input[type=date]{color-scheme:light}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--brand-red-glow)}60%{opacity:.82;box-shadow:0 0 0 6px transparent}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hatch{background:repeating-linear-gradient(45deg,var(--brand-surface),var(--brand-surface) 4px,var(--brand-surface2) 4px,var(--brand-surface2) 8px)!important}
.spin{animation:spin 1s linear infinite}
/* ── Responsive layout ── */
.app-shell{display:flex;min-height:100vh}
.side-nav{display:none;width:220px;background:var(--brand-surface);border-right:1px solid var(--brand-border);flex-shrink:0;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main-col{flex:1;display:flex;flex-direction:column;background:var(--brand-bg);min-height:100vh;min-width:0}
@media(min-width:1024px){
  .side-nav{display:flex}
  .mob-header{display:none}
  .bot-nav{display:none!important}
  .main-col{max-width:none}
  .content-wrap{padding-bottom:24px!important}
}
@media(max-width:1023px){
  .app-shell{display:block}
  .main-col{max-width:var(--app-w,430px);margin:0 auto}
}
.room-grid{display:flex;flex-wrap:wrap;gap:8px}
.modal-ov{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.modal-ov2{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.modal-panel{width:100%;max-width:var(--app-w,430px);background:var(--brand-surface);border-radius:20px 20px 0 0;padding:20px 16px 44px;animation:slideUp .2s ease}
.modal-panel2{width:100%;max-width:var(--app-w,430px);margin:0 auto;background:var(--brand-surface);border-radius:20px 20px 0 0;padding:20px 20px 44px;animation:slideUp .22s ease}
.modal-panel3{width:100%;max-width:var(--app-w,430px);margin:0 auto;background:var(--brand-surface);border-radius:20px 20px 0 0;padding:20px 20px 48px;animation:slideUp .22s ease}
@media(min-width:1024px){

  .modal-ov2{align-items:center;justify-content:center}
  .modal-panel{max-width:520px;border-radius:20px;padding:24px 24px 28px}
  .modal-panel2{max-width:520px;border-radius:20px;padding:24px}
  .modal-panel3{max-width:520px;border-radius:20px;padding:24px}
}
